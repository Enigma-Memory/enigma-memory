name: Cortex v3 Anchor Build and Test

on:
  push:
    paths:
      - 'cortex-v3/**'
      - '.github/workflows/cortex-v3-anchor.yml'
  pull_request:
    paths:
      - 'cortex-v3/**'
      - '.github/workflows/cortex-v3-anchor.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_CLI_VERSION: 1.18.26
  SOLANA_RELEASE_SHA256: 10246c7f446006036192d81d859e761bcb3e7d1f40059bf27a56e1c29b0dbc40
  ANCHOR_VERSION: 0.30.1
  NODE_VERSION: 20
  RUST_TOOLCHAIN: 1.75.0

jobs:
  anchor-build:
    name: Anchor Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cortex-v3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_CLI_VERSION }}

      - name: Install Solana CLI from GitHub release
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/solana
          cd ~/.local/share/solana
          curl -L -o solana-release.tar.bz2 "https://github.com/solana-labs/solana/releases/download/v${SOLANA_CLI_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${SOLANA_RELEASE_SHA256}  solana-release.tar.bz2" | sha256sum --check --strict
          tar -xjf solana-release.tar.bz2
          mv solana-release solana-${SOLANA_CLI_VERSION}
          rm solana-release.tar.bz2
          echo "$HOME/.local/share/solana/solana-${SOLANA_CLI_VERSION}/bin" >> $GITHUB_PATH

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/solana-${SOLANA_CLI_VERSION}/bin" >> $GITHUB_PATH

      - name: Configure ephemeral test wallet
        run: |
          install -m 700 -d ~/.config/solana
          solana-keygen new --no-bip39-passphrase --silent --force --outfile ~/.config/solana/id.json
          solana config set --url localhost

      - name: Install Anchor CLI
        run: npm install -g @coral-xyz/anchor-cli@${ANCHOR_VERSION}

      - name: Verify Anchor CLI
        run: anchor --version

      - name: Install workspace dependencies
        run: npm install

      - name: Cargo Check (Rust compilation)
        run: cargo check --workspace

      - name: Anchor Build
        run: |
          anchor build --no-idl
          mkdir -p target/idl
          cp idl/*.json target/idl/

      - name: Anchor Test
        run: anchor test --skip-build
        timeout-minutes: 15
