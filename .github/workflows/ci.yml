name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-gates:
    name: Package gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Reject personal commit metadata
        shell: bash
        run: |
          while IFS= read -r email; do
            case "${email,,}" in
              296258884+enigma-memory@users.noreply.github.com|enigma-memory@users.noreply.github.com|enigma-memory-automation@users.noreply.github.com|*@enigmamemory.com|noreply@github.com) ;;
              *) echo "::error::Public commit metadata must use the Enigma project identity"; exit 1 ;;
            esac
          done < <(git log --format='%ae%n%ce')

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Run secret scan
        run: npm run secret-scan

      - name: Run package metadata check
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Verify package dry run
        run: npm pack --dry-run

      - name: Verify local packed install
        run: npm run package:install-smoke

      - name: Run release audit when available
        run: npm run release:audit
