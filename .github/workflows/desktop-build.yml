name: Desktop build (unsigned dry-run)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  UPDATER_MANIFEST_URL: "https://example.com/enigma-desktop/updater.json"

jobs:
  build:
    name: Build desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: apps/desktop-tauri

      - name: Cache Tauri CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-tauri-cli-v2.11.4

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Run package metadata check
        run: npm run check

      - name: Run secret scan
        run: npm run secret-scan

      - name: Run clippy
        working-directory: apps/desktop-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check Tauri app
        working-directory: apps/desktop-tauri
        run: cargo check --bin enigma-desktop-tauri

      - name: Run desktop tests
        working-directory: apps/desktop-tauri
        run: cargo test

      - name: Generate dry-run updater signing key
        id: keygen
        working-directory: apps/desktop-tauri
        shell: bash
        run: |
          # Generate a one-time Ed25519 key pair for this dry-run build so the
          # updater plugin can sign bundles without requiring repository secrets.
          cargo tauri signer generate --ci -w .tauri-dry-run.key
          echo "private_key_path=$(pwd)/.tauri-dry-run.key" >> "$GITHUB_OUTPUT"
          echo "public_key=$(cat .tauri-dry-run.key.pub)" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        working-directory: apps/desktop-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ steps.keygen.outputs.private_key_path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          cargo tauri build --bundles ${{ matrix.bundle }} \
            --config '{"plugins":{"updater":{"pubkey":"${{ steps.keygen.outputs.public_key }}"}}}'
      - name: Remove dry-run updater key
        if: always()
        working-directory: apps/desktop-tauri
        shell: bash
        run: rm -f .tauri-dry-run.key .tauri-dry-run.key.pub

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: enigma-desktop-${{ matrix.os }}-dry-run
          path: |
            apps/desktop-tauri/target/release/bundle/nsis/*.exe
            apps/desktop-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop-tauri/target/release/bundle/app/*.app
          retention-days: 7
