name: Deploy Cortex v3 to Devnet

'on':
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_CLI_VERSION: 1.18.26
  SOLANA_RELEASE_SHA256: 10246c7f446006036192d81d859e761bcb3e7d1f40059bf27a56e1c29b0dbc40
  ANCHOR_VERSION: 0.30.1
  NODE_VERSION: 20
  SOLANA_CLUSTER: devnet

jobs:
  deploy-devnet:
    name: Build and deploy to devnet
    runs-on: ubuntu-latest
    environment: devnet
    defaults:
      run:
        working-directory: cortex-v3

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Solana CLI
        id: cache-solana
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_CLI_VERSION }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/solana
          cd ~/.local/share/solana
          curl -fsSL -o solana-release.tar.bz2 \
            "https://github.com/solana-labs/solana/releases/download/v${SOLANA_CLI_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${SOLANA_RELEASE_SHA256}  solana-release.tar.bz2" | sha256sum --check --strict
          tar -xjf solana-release.tar.bz2
          mv solana-release solana-${SOLANA_CLI_VERSION}
          rm solana-release.tar.bz2
          echo "$HOME/.local/share/solana/solana-${SOLANA_CLI_VERSION}/bin" >> $GITHUB_PATH

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/solana-${SOLANA_CLI_VERSION}/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: npm install -g @coral-xyz/anchor-cli@${ANCHOR_VERSION}

      - name: Install workspace dependencies
        run: npm install

      - name: Configure devnet wallet
        env:
          SOLANA_DEVNET_WALLET: ${{ secrets.SOLANA_DEVNET_WALLET }}
        run: |
          test -n "${SOLANA_DEVNET_WALLET}"
          install -m 700 -d ~/.config/solana
          printf '%s' "${SOLANA_DEVNET_WALLET}" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          solana config set --keypair ~/.config/solana/id.json --url ${{ env.SOLANA_CLUSTER }}
          echo "Deployer pubkey: $(solana address)"

      - name: Run deploy-devnet.sh
        run: |
          chmod +x deploy/deploy-devnet.sh
          SKIP_INSTALL=1 ./deploy/deploy-devnet.sh

      - name: Remove devnet wallet
        if: always()
        run: rm -f ~/.config/solana/id.json

      - name: Upload devnet IDLs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devnet-idls
          path: cortex-v3/deploy/devnet-idls/*.json
          retention-days: 7
